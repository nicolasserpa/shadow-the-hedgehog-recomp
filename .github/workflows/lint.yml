name: lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: python -m pip install ruff mypy cpplint

      - name: ruff check
        run: ruff check tools src

      - name: ruff format check
        run: ruff format --check tools src

      - name: mypy
        run: mypy tools/hooks src/dump_syscall.py src/generate_register.py

      - name: cpplint
        run: cpplint src/shadow_stubs.cpp
